---
layout: compress
---

{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0b0e">
    <meta name="color-scheme" content="dark">

    {% include seo.html %}
    <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
    <link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico?v=M44lzPylqQ">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0b0e;
        font-family: Inter, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -.003em;
        overflow: hidden;
      }
      a { color: #7aa2f7; text-decoration: none; }
      a:hover { color: #a9c1ff; }

      .stage { position: fixed; inset: 0; background: #0a0b0e; overflow: hidden; }
      /* cave.js draws one canvas pixel per cave pixel and sizes the element itself */
      #cave { position: absolute; left: 0; top: 0; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
      .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(115% 105% at 50% 50%, rgba(0,0,0,0) 0 56%, rgba(0,0,0,.2) 84%, rgba(0,0,0,.42) 100%);
      }

      /* ---- chrome ---- */
      .bar {
        position: absolute; left: 0; right: 0; display: flex; align-items: center;
        justify-content: space-between; padding: 0 18px; pointer-events: none; z-index: 4;
      }
      .bar--top { top: 0; height: 54px; }
      .bar--bottom { bottom: 0; height: 46px; }
      .pill {
        font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: .1em; color: #5c6470;
        padding: 7px 9px; background: rgba(10,11,14,.72); border: 1px solid #22262e; border-radius: 5px;
      }
      .wordmark { font-weight: 700; font-size: 12px; letter-spacing: .14em; color: #e9ecf1; }
      .topleft { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
      .nav {
        display: flex; gap: 4px; padding: 4px;
        background: rgba(10,11,14,.72); border: 1px solid #22262e; border-radius: 6px;
      }
      .nav a, .nav button {
        font: 500 11px/1 'JetBrains Mono', monospace; letter-spacing: .08em;
        color: #8b93a1; background: transparent; border: 0; border-radius: 4px;
        padding: 7px 10px; cursor: pointer; transition: color .15s, background .15s;
      }
      .nav a:hover, .nav button:hover { color: #e9ecf1; }
      .nav .is-active { color: #e9ecf1; background: rgba(122,162,247,.16); }

      /* ---- content plate ---- */
      #plate-wrap {
        position: absolute; inset: 54px 0 46px; display: flex;
        justify-content: center; align-items: center; pointer-events: none; z-index: 3;
      }
      #plate {
        position: relative;
        /* as much of the window as the rock can spare: an 80px wall either
           side at the narrowest, and just enough ceiling and floor beyond the
           bars for something to grow on */
        width: min(1000px, calc(100vw - 160px));
        height: min(calc(100vh - 176px), 880px);
        pointer-events: auto;
        display: flex; flex-direction: column;
      }
      /* No frame — just a wash in the cave's own base colour (#12141a, the fill
         cave.js lays down before the rock). Because it matches, it disappears
         against open cave and only softens the rock and leaves that reach in
         behind the content.

         It's a blurred rounded slab rather than a radial gradient so the dark
         region ends AT the box edge — the tonal transition and the edge of the
         content are the same line, instead of the wash thinning out across the
         last few lines of text. */
      #plate::before {
        content: "";
        position: absolute; inset: -10px -14px; z-index: 0; pointer-events: none;
        background: rgba(18,20,26,.72);
        border-radius: 20px;
        filter: blur(14px);
      }
      #plate-scroll {
        position: relative; z-index: 1;
        flex: 1; overflow-y: auto; padding: 26px 34px 36px;
        scrollbar-width: none; -ms-overflow-style: none;
        /* soften where scrolling content meets the top and bottom of the pool */
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 14px), transparent 100%);
                mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 14px), transparent 100%);
      }
      #plate-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
      /* the pool is wide; the reading column stays a comfortable measure inside it */
      #plate-scroll > * { max-width: 760px; margin-left: auto; margin-right: auto; }

      /* ---- identity header ---- */
      .ident {
        display: flex; align-items: center; gap: 16px;
        padding-bottom: 22px; border-bottom: 1px solid #22262e;
      }
      .ident img {
        width: 62px; height: 62px; border-radius: 50%;
        border: 1px solid #2e333d; background: #14161b; object-fit: cover;
      }
      .ident h1 {
        margin: 0; color: #e9ecf1; font-size: 24px; font-weight: 600;
        letter-spacing: -.03em; line-height: 1.1;
      }
      .ident__meta {
        display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px;
        font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: .06em; color: #868e9c;
      }
      .ident__meta span { padding: 4px 7px; border: 1px solid #22262e; border-radius: 4px; }
      .social {
        display: flex; flex-wrap: wrap; gap: 14px; padding: 14px 0 4px;
        font: 500 11px/1 'JetBrains Mono', monospace; letter-spacing: .07em;
      }
      .social a { color: #8b93a1; }
      .social a:hover { color: #e9ecf1; }

      /* ---- about panel ---- */
      .panel { padding-top: 22px; color: #b7bfcb; font-size: 17px; line-height: 1.75; }
      .lead { margin: 0 0 24px; font-size: 19px; line-height: 1.6; color: #d6dbe4; text-wrap: pretty; }
      .rule { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; }
      .rule__no { font: 700 10px/1 'JetBrains Mono', monospace; letter-spacing: .14em; color: #7aa2f7; }
      .rule h2 {
        margin: 0; color: #e9ecf1; font-size: 13px; font-weight: 600;
        letter-spacing: .1em; text-transform: uppercase;
      }
      .rule__line { flex: 1; height: 1px; background: #22262e; }

      .paper {
        padding: 20px 22px; border: 1px solid rgba(122,162,247,.14); border-radius: 10px;
        background: rgba(20,22,27,.45); margin-bottom: 26px;
      }
      .paper p { margin: 0; font-size: 16px; line-height: 1.7; color: #949cab; text-wrap: pretty; }
      .paper strong { color: #b7bfcb; font-weight: 600; }

      figure { margin: 0 0 22px; }
      figure img { display: block; width: 100%; border-radius: 6px; }
      figcaption {
        margin-top: 8px; color: #5c6470;
        font: 400 11px 'JetBrains Mono', monospace; letter-spacing: .04em;
      }

      .panel p.body { margin: 0 0 20px; font-size: 17px; color: #a2aab8; line-height: 1.75; }
      .plain {
        margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;
        gap: 10px; font-size: 17px; color: #a2aab8; line-height: 1.75;
      }

      /* ---- posts panel ---- */
      .posts__head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 18px; }
      .posts__count { font: 400 10px 'JetBrains Mono', monospace; color: #5c6470; }
      .post {
        display: grid; grid-template-columns: 92px 1fr; gap: 16px;
        padding: 16px 12px; margin: 0 -12px; border-radius: 8px;
        border-bottom: 1px solid rgba(34,38,46,.8); transition: background .15s;
      }
      .post:hover { background: rgba(122,162,247,.07); }
      .post__when {
        font: 400 10px/1.6 'JetBrains Mono', monospace; letter-spacing: .06em; color: #5c6470;
      }
      .post__body { display: flex; flex-direction: column; gap: 6px; }
      .post__title {
        color: #e9ecf1; font-size: 17px; font-weight: 600;
        letter-spacing: -.02em; line-height: 1.3;
      }
      .post:hover .post__title { color: #a9c1ff; }
      .post__blurb { color: #949cab; font-size: 15px; line-height: 1.65; text-wrap: pretty; }

      /* ---- phones: plain page ----
         No cave, no floating plate, no pooled wash — the document just scrolls.
         The canvas is decoration a phone is too narrow to show much of, and a
         viewport-locked plate fights mobile scrolling. */
      @media (max-width: 720px) {
        html, body { height: auto; overflow: visible; }
        #cave, .vignette { display: none; }
        .stage { position: static; inset: auto; overflow: visible; min-height: 100vh; }

        .bar { position: static; height: auto; pointer-events: auto; }
        .bar--top {
          position: sticky; top: 0; z-index: 10;
          padding: 12px 18px; border-bottom: 1px solid #22262e;
          background: rgba(10,11,14,.92);
          -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        }
        .bar--bottom {
          margin-top: 28px; padding: 22px 18px 26px;
          border-top: 1px solid #22262e;
        }
        .topleft { flex-wrap: wrap; gap: 10px 14px; }
        .pill { background: transparent; border: 0; padding: 0; }
        .nav { background: transparent; border: 0; padding: 0; gap: 2px; margin-left: -10px; }

        #plate-wrap { position: static; inset: auto; display: block; pointer-events: auto; }
        #plate { width: auto; height: auto; display: block; }
        #plate::before { display: none; }
        #plate-scroll {
          overflow: visible; padding: 22px 18px 0;
          -webkit-mask-image: none; mask-image: none;
        }
        #plate-scroll > * { max-width: none; }

        .ident { gap: 12px; }
        .ident img { width: 52px; height: 52px; }
        .ident h1 { font-size: 20px; }
        .panel { font-size: 16px; }
        .lead { font-size: 18px; }
        .post { grid-template-columns: 1fr; gap: 6px; }
      }

      :focus-visible { outline: 2px solid rgba(122,162,247,.6); outline-offset: 2px; }
    </style>
  </head>

  <body>
    <div class="stage">
      <canvas id="cave" aria-hidden="true"></canvas>
      <div class="vignette"></div>

      <header class="bar bar--top">
        <div class="topleft">
          <span class="pill wordmark">{{ site.title | upcase }}</span>
          <nav class="nav">
            <button type="button" data-tab="home" class="is-active" aria-selected="true">ABOUT</button>
            <a href="{{ base_path }}/year-archive/" data-tab="blog" aria-selected="false">POSTS</a>
            <a href="{{ base_path }}/cv/">CV</a>
          </nav>
        </div>
      </header>

      <div id="plate-wrap">
        <div id="plate">
          <div id="plate-scroll">
            {{ content }}
          </div>
        </div>
      </div>

      <footer class="bar bar--bottom">
        <span class="pill">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title | upcase }}</span>
      </footer>
    </div>

    <script src="{{ base_path }}/assets/js/cave.js"></script>
    {% include analytics.html %}
  </body>
</html>
